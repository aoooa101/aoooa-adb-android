name: 功能建议 (Feature Request)
description: 为 aoooa-adb 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 aoooa-adb 的演进提供宝贵建议！
  - type: textarea
    id: feature_problem
    attributes:
      label: 需求背景 / 遇到的问题 (Problem Statement)
      description: 请清晰描述你想解决的痛点或目前使用中遇到的局限
    validations:
      required: true
  - type: textarea
    id: feature_solution
    attributes:
      label: 期望的解决方案 (Proposed Solution)
      description: 你希望 aoooa-adb 具备什么样的新功能或怎样的交互流程
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案 (Alternatives Considered)
      description: 你是否考虑过其他现有的替代方案或临时解决方式？
