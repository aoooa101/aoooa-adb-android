name: Unit Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # --continue：单元测试失败时仍继续执行 Lint，便于一次拿到全部结果
      - name: Run unit tests and Android Lint
        run: gradle testDebugUnitTest lintDebug --no-daemon --continue --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Summarize failures
        if: failure()
        run: |
          echo "### ❌ 检查未通过" >> $GITHUB_STEP_SUMMARY
          echo "请在运行页面的 Artifacts 中下载 unit-test-report / lint-report 查看明细。" >> $GITHUB_STEP_SUMMARY
