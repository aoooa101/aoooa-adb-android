name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildType:
        description: "debug or release"
        type: choice
        options: [ debug, release ]
        default: release

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode and verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '')
          raw = ''.join(raw.split())
          target = os.environ['RUNNER_TEMP'] + '/release.keystore'
          if raw:
              try:
                  data = base64.b64decode(raw)
                  if len(data) > 500:
                      with open(target, 'wb') as f:
                          f.write(data)
                      print(f'Keystore decoded successfully, size: {len(data)} bytes')
                  else:
                      print(f'Base64 decoded data too small: {len(data)} bytes')
              except Exception as e:
                  print(f'Base64 decode failed: {e}')
          else:
              print('No KEYSTORE_BASE64 Secret found')
          "

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -s "$KEYSTORE_FILE" ]; then
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "✅ Keystore verification passed!"
            else
              echo "⚠️ Keystore verification failed, falling back to debug signing."
              rm -f "$KEYSTORE_FILE"
            fi
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Capture build diagnostics
        if: always()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 50 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.0
          name: "v2.0.0"
          body: |
            ### 🚀 WebADB v2.0.0 更新日志

            #### ✨ 重大架构革新
            - **100% 纯原生 Kotlin + Jetpack Compose 重构**：彻底告别 1.0 时代的 WebView 与庞大静态资源包，体积由 19MB 瘦身至 14MB，运行秒开、丝滑流畅。
            - **全栈自研 Android 11+ 无线调试配对引擎**：原生支持 TLS 1.3 双向认证、EKM 通道绑定与 SPAKE2 椭圆曲线密码学握手，零外部网络依赖。
            - **Shizuku 风格快捷配对**：支持后台 mDNS 自动嗅探，下拉通知栏输入 6 位配对码一键直连。

            #### 🛠️ 新增功能与优化
            - **全新权限管理卡片**：在设置页实时展示通知权限状态，支持一键便捷授权。
            - **全量中英双语国际化**：智能识别系统语言（中文显示 zh，其他语言默认 en），通知栏与主界面实现 100% 双语无缝覆盖。
            - **免责声明与安全机制**：首次启动弹出开发者调试免责声明，全面保障使用合规性。
            - **有线 USB 与无线调试双轨稳定**：彻底修复 USB 读线程死锁与低版本授权弹窗问题。
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false

      - name: Clean up old Releases and Tags (keep only v2.0.0)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null | grep -v '^v2\.0\.0$' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done || true
