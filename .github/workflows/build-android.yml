name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildType:
        description: "debug or release"
        type: choice
        options: [ debug, release ]
        default: release

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode and verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '')
          raw = ''.join(raw.split())
          target = os.environ['RUNNER_TEMP'] + '/release.keystore'
          if raw:
              try:
                  data = base64.b64decode(raw)
                  if len(data) > 500:
                      with open(target, 'wb') as f:
                          f.write(data)
                      print(f'Keystore decoded successfully, size: {len(data)} bytes')
                  else:
                      print(f'Base64 decoded data too small: {len(data)} bytes')
              except Exception as e:
                  print(f'Base64 decode failed: {e}')
          else:
              print('No KEYSTORE_BASE64 Secret found')
          "

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -s "$KEYSTORE_FILE" ]; then
            echo "Validating Keystore with keytool..."
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "✅ Keystore verification passed!"
            else
              echo "⚠️ Keystore password mismatch! Falling back to standard signing."
              rm -f "$KEYSTORE_FILE"
            fi
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -eo pipefail
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          echo "Starting Gradle Release Build..."
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
              echo "⚠️ Custom signing build failed, fallbacking to standard signing build..."
              unset KEYSTORE_PATH
              ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
            }
          else
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
              echo "⚠️ Custom signing build failed, fallbacking to standard signing build..."
              unset KEYSTORE_PATH
              gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
            }
          fi

      - name: Capture build diagnostics
        if: always()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 50 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          APK=$(ls app/build/outputs/apk/release/app-*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/*/app-*.apk 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then echo "❌ APK not found!"; exit 1; fi

          APP_VERSION=$(grep 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v${APP_VERSION}"

          echo "✅ Found APK: $APK"
          echo "🚀 Publishing to Release Tag: $TAG"

          gh release create "$TAG" "$APK" --title "WebADB v${APP_VERSION} ($(date +%Y-%m-%d))" --notes "WebADB v${APP_VERSION} Release Build" --clobber || \
          gh release upload "$TAG" "$APK" --clobber

          # 自动清理旧 Release，只保留最新 3 个
          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null | tail -n +4 || true)
          for OLD in $OLD_RELEASES; do
            echo "清理旧 Release: $OLD"
            gh release delete "$OLD" --yes || true
          done
