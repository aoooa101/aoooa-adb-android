name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildType:
        description: "debug or release"
        type: choice
        options: [ debug, release ]
        default: release

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '')
          raw = ''.join(raw.split())
          target = os.environ['RUNNER_TEMP'] + '/release.keystore'
          if raw:
              try:
                  data = base64.b64decode(raw)
                  if len(data) > 500:
                      with open(target, 'wb') as f:
                          f.write(data)
                      print(f'Keystore decoded successfully, size: {len(data)} bytes')
                  else:
                      print(f'Base64 decoded data too small: {len(data)} bytes')
              except Exception as e:
                  print(f'Base64 decode failed: {e}')
          else:
              print('No KEYSTORE_BASE64 Secret found')
          "

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -eo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          SIGN_ARGS=""
          TASK="assembleDebug"

          if [ -s "$KEYSTORE_FILE" ]; then
            echo "Release keystore detected, validating with keytool..."
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "Keystore validation passed! Building Release APK with custom signature..."
              TASK="assembleRelease"
              SIGN_ARGS="-Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
                         -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                         -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                         -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            else
              echo "Keystore password mismatch, falling back to assembleDebug..."
            fi
          else
            echo "No valid release keystore found, building Debug APK..."
          fi

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew $TASK --no-daemon --stacktrace $SIGN_ARGS 2>&1 | tee /tmp/build.log
          else
            gradle $TASK --no-daemon --stacktrace $SIGN_ARGS 2>&1 | tee /tmp/build.log
          fi

      - name: Capture build error on failure
        if: failure()
        run: |
          { grep -E "^e: |: error:|Unresolved|Could not find|Could not resolve|Duplicate class|none of the following|Type mismatch|Compilation error|Exception" /tmp/build.log | head -80; echo "----TAIL----"; tail -c 3500 /tmp/build.log; } > build_error.txt 2>/dev/null || echo "no log captured" > build_error.txt
          git config user.name "ci"
          git config user.email "ci@example.com"
          git pull --rebase origin main || true
          git add build_error.txt
          git commit -m "chore: capture build error" --allow-empty || true
          git push origin main || true

      - name: Upload APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          APK=$(ls app/build/outputs/apk/*/app-*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi

          APP_VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          TAG="v${APP_VERSION}"

          gh release create "$TAG" "$APK" --title "WebADB v${APP_VERSION} ($(date +%Y-%m-%d))" --notes "WebADB v${APP_VERSION} Release Build" --clobber || \
          gh release edit "$TAG" --title "WebADB v${APP_VERSION} ($(date +%Y-%m-%d))" --notes "WebADB v${APP_VERSION} Release Build"

          # 自动清理旧 Release，只保留最新 3 个
          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null | tail -n +4 || true)
          for OLD in $OLD_RELEASES; do
            echo "清理旧 Release: $OLD"
            gh release delete "$OLD" --yes || true
          done
