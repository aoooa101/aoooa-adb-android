name: Build Android APK

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES'
      - '.gitignore'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      buildType:
        description: "debug or release"
        type: choice
        options: [ debug, release ]
        default: release

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode and verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '')
          raw = ''.join(raw.split())
          target = os.environ['RUNNER_TEMP'] + '/release.keystore'
          if raw:
              try:
                  data = base64.b64decode(raw)
                  if len(data) > 500:
                      with open(target, 'wb') as f:
                          f.write(data)
                      print(f'Keystore decoded successfully, size: {len(data)} bytes')
                  else:
                      print(f'Base64 decoded data too small: {len(data)} bytes')
              except Exception as e:
                  print(f'Base64 decode failed: {e}')
          else:
              print('No KEYSTORE_BASE64 Secret found')
          "

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -s "$KEYSTORE_FILE" ]; then
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "✅ Keystore verification passed!"
            else
              echo "❌ Keystore verification failed! Password mismatch."
              exit 1
            fi
          else
            echo "❌ No release keystore found in Secrets! Build aborted."
            exit 1
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          BUILD_TYPE: ${{ inputs.buildType || 'release' }}
        run: |
          set -euo pipefail
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          APP_VER=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          case "$BUILD_TYPE" in
            debug)
              TASK=assembleDebug
              TAG="debug-v${APP_VER}-${GITHUB_RUN_NUMBER}"
              ;;
            release)
              TASK=assembleRelease
              TAG="v${APP_VER}"
              ;;
            *) echo "Invalid build type"; exit 1 ;;
          esac
          echo "APP_VERSION=$APP_VER" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          gradle "$TASK" --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Capture build diagnostics
        if: always()
        run: |
          if [ -f /tmp/build.log ]; then
            echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 50 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # 按优先级逐步上传 Release 附件：64位 -> 32位 -> 通用全包
      - name: Upload 64-bit APK (arm64-v8a)
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.BUILD_TYPE == 'debug' }}
          name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*-arm64-v8a.apk
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Upload 32-bit APK (armeabi-v7a)
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.BUILD_TYPE == 'debug' }}
          files: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*-armeabi-v7a.apk
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Upload Universal APK
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.BUILD_TYPE == 'debug' }}
          files: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*-universal.apk
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Write dev build metadata
        if: success() && github.ref == 'refs/heads/dev'
        run: |
          printf 'commit=%s\nversionName=%s\nversionCode=%s\nbuildType=%s\n' \
            "$GITHUB_SHA" "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$BUILD_TYPE" \
            > app/build/outputs/apk/build-info.txt

      - name: Upload dev APK artifacts
        if: success() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: aoooa-adb-dev-${{ github.run_number }}
          retention-days: 7
          path: |
            app/build/outputs/apk/${{ env.BUILD_TYPE }}/*-arm64-v8a.apk
            app/build/outputs/apk/${{ env.BUILD_TYPE }}/*-armeabi-v7a.apk
            app/build/outputs/apk/${{ env.BUILD_TYPE }}/*-universal.apk
            app/build/outputs/apk/build-info.txt
          if-no-files-found: error

