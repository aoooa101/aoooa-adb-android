name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildType:
        description: "debug or release"
        type: choice
        options: [ debug, release ]
        default: debug

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore (if secret present)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'debug' }}
          VERSION_CODE: ${{ github.event.inputs.buildType == 'release' && format('{0}', github.run_number) || '1' }}
        run: |
          set -eo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            TASK="assembleRelease"
            export VERSION_CODE=${{ github.run_number }}
          else
            TASK="assembleDebug"
          fi

          SIGN_ARGS=""
          if [ -f "$RUNNER_TEMP/release.keystore" ] && [ "$BUILD_TYPE" = "release" ]; then
            SIGN_ARGS="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore \
                       -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                       -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                       -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          fi

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew $TASK --no-daemon --stacktrace $SIGN_ARGS 2>&1 | tee /tmp/build.log
          else
            gradle $TASK --no-daemon --stacktrace $SIGN_ARGS 2>&1 | tee /tmp/build.log
          fi

      - name: Capture build error on failure
        if: failure()
        run: |
          { grep -E "^e: |: error:|Unresolved|Could not find|Could not resolve|Duplicate class|none of the following|Type mismatch|Compilation error" /tmp/build.log | head -60; echo "----TAIL----"; tail -c 2500 /tmp/build.log; } > build_error.txt 2>/dev/null || echo "no log captured" > build_error.txt
          git config user.name "ci"
          git config user.email "ci@example.com"
          git add build_error.txt
          git commit -m "chore: capture build error" --allow-empty || true

      - name: Upload APK to Release
        if: success()
        env:
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'debug' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          APK=$(ls app/build/outputs/apk/*/app-*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi

          # 从 build.gradle.kts 提取 versionName（如 1.0.0）
          APP_VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
          TAG="build-$(date +%Y%m%d%H%M%S)"
          NOTES=$(printf 'Build type: %s\nApp version: v%s\n\n- Download the APK and tap to install\n- Allow "install unknown apps" for your browser/file manager if prompted' "$BUILD_TYPE" "$APP_VERSION")

          gh release create "$TAG" "$APK" --title "WebADB v${APP_VERSION} ($(date +%Y-%m-%d))" --notes "$NOTES"

          # 自动清理旧 Release，只保留最新 3 个，避免堆积
          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' | tail -n +4)
          for OLD in $OLD_RELEASES; do
            echo "清理旧 Release: $OLD"
            gh release delete "$OLD" --yes || true
          done
