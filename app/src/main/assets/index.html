<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebADB</title>
<style>
:root{--bg:#0b0f19;--card:#151e2e;--sub:#1e293b;--tx:#f8fafc;--dim:#94a3b8;--bd:#334155;--acc:#2563eb;--ok:#10b981;--err:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;padding-bottom:24px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;font-weight:600}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--sub);color:var(--dim);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.badge.ok{background:rgba(16,185,129,.18);color:#34d399}
.badge.ok .dot{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;margin-top:8px}
button{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
button:active{opacity:.85}
button.ghost{background:var(--sub);color:#cbd5e1}
input,select{width:100%;padding:10px;background:#090d16;border:1px solid var(--bd);border-radius:8px;color:#38bdf8;font-size:13px;outline:none}
input{margin-top:8px}
label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.info b{color:#38bdf8;font-weight:600;font-family:ui-monospace,monospace}
#logs{background:#090d16;border:1px solid var(--bd);border-radius:8px;padding:10px;height:180px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.lg{margin-bottom:2px}.lg .t{color:#64748b;margin-right:5px}
.lg.info{color:#94a3b8}.lg.succ{color:#34d399}.lg.warn{color:#fbbf24}.lg.err{color:#f87171}.lg.cmd{color:#38bdf8}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">WebADB 控制台</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="ghost" id="langBtn" style="padding:4px 10px;font-size:12px">English</button>
      <div class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">未连接</span></div>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <button id="usbBtn" style="flex:1">连接 USB 设备</button>
      <button id="discBtn" class="ghost">断开</button>
    </div>
    <label id="wirelessLabel" style="margin-top:10px">无线调试 (ADB over TCP)</label>
    <div class="row">
      <input id="ipInput" placeholder="设备 IP:5555" style="margin-top:0;flex:1" inputmode="numeric">
      <button id="tcpBtn" class="ghost">连接</button>
    </div>
    <div class="hint" id="hint11">Android 11+ 请先用 USB 连接执行「开启 5555」，或使用手动 adb tcpip 5555</div>
  </div>

  <div class="card" id="infoCard" style="display:none">
    <div class="grid">
      <div><span id="lblModel">型号</span><br><span class="info" id="infoModel" style="color:#38bdf8">-</span></div>
      <div><span id="lblOs">系统</span><br><span class="info" id="infoOs" style="color:#38bdf8">-</span></div>
      <div><span id="lblBat">电量</span><br><span class="info" id="infoBat" style="color:#38bdf8">-</span></div>
      <div><span id="lblSel">SELinux</span><br><span class="info" id="infoSel" style="color:#38bdf8">-</span></div>
    </div>
  </div>

  <div class="card">
    <label id="lblPreset">预设命令</label>
    <select id="preset">
      <option value="" disabled selected>--</option>
      <option value="shizuku">启动 Shizuku（自动定位）</option>
      <option value="tcpip_on">开启 5555 无线调试</option>
      <option value="tcpip_off">关闭无线调试端口</option>
      <option value="pm list packages -3">查看第三方应用</option>
      <option value="dumpsys battery">电池状态</option>
      <option value="wm size">屏幕分辨率</option>
    </select>
    <div class="row">
      <input id="cmdInput" placeholder="输入 ADB shell 命令" style="margin-top:8px;flex:1">
      <button id="execBtn">执行</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px">
      <span id="lblLog">终端日志</span><span id="clearBtn" style="cursor:pointer">[清空]</span>
    </div>
    <div id="logs"></div>
  </div>
</div>

<script src="./vendor/adb-bundle.js"></script>
<script>
const { Adb, AdbDaemonTransport, AdbTcpIpService } = window.ADB;

// 内存凭证存储（WebView file:// 下 IndexedDB 不可用，改用内存避免秒失败）
// 每次启动生成新 RSA 密钥 -> 设备会弹一次"允许 USB 调试"，之后同会话内复用
const memoryStore = (() => {
    const keys = [];
    return {
        async generateKey() {
            const { privateKey } = await crypto.subtle.generateKey(
                { name: 'RSASSA-PKCS1-v1_5', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-1' },
                true, ['sign', 'verify']);
            const buffer = new Uint8Array(await crypto.subtle.exportKey('pkcs8', privateKey));
            const rec = { buffer, name: 'webadb@' + (globalThis.location?.hostname || 'app') };
            keys.push(rec);
            return rec;
        },
        async *iterateKeys() { for (const k of keys) yield k; }
    };
})();

// ---------- i18n（集中字典） ----------
const I18N = {
  zh: { title:'WebADB 控制台', conn:'未连接', connected:'已连接', usbBtn:'连接 USB 设备', disc:'断开',
    wireless:'无线调试 (ADB over TCP)', tcpBtn:'连接', hint11:'Android 11+ 请先用 USB 连接执行「开启 5555」',
    model:'型号', os:'系统', bat:'电量', sel:'SELinux', preset:'预设命令', log:'终端日志',
    cmdPh:'输入 ADB shell 命令', ready:'就绪，请选择连接方式', noUsb:'未找到 USB ADB 设备',
    permDenied:'USB 权限被拒绝', connErr:'连接失败（请检查 IP/端口/5555 是否开启）',
    authFail:'认证失败: ', noCmd:'请输入命令', noConn:'请先连接设备', execOk:'(执行完成，无输出)',
    err:'执行异常: ', shizukuSearch:'正在定位 Shizuku...', shizukuNone:'未检测到 Shizuku，请先安装',
    shizukuNoSo:'未能定位 libshizuku.so', shizukuOk:'Shizuku 启动成功！', tcpipOn:'正在开启 5555...',
    tcpipOff:'正在关闭 5555...', tcpipRestart:'已执行（adbd 正在重启，连接会短暂断开）',
    done:'执行完成', connReq:'正在请求 USB 权限...', allow:'若设备弹窗请点「允许」' },
  en: { title:'WebADB Console', conn:'Disconnected', connected:'Connected', usbBtn:'Connect USB',
    disc:'Disconnect', wireless:'Wireless (ADB over TCP)', tcpBtn:'Connect',
    hint11:'Android 11+: enable 5555 via USB first, or use adb tcpip 5555',
    model:'Model', os:'Android', bat:'Battery', sel:'SELinux', preset:'Presets', log:'Logs',
    cmdPh:'Type ADB shell command', ready:'Ready. Choose a connection method', noUsb:'No USB ADB device found',
    permDenied:'USB permission denied', connErr:'Connection failed (check IP/port/5555)',
    authFail:'Auth failed: ', noCmd:'Enter a command', noConn:'Connect a device first',
    execOk:'(Done, no output)', err:'Error: ', shizukuSearch:'Locating Shizuku...',
    shizukuNone:'Shizuku not found. Install it first', shizukuNoSo:'libshizuku.so not found',
    shizukuOk:'Shizuku started!', tcpipOn:'Enabling port 5555...', tcpipOff:'Disabling port 5555...',
    tcpipRestart:'Done (adbd restarting, connection will drop briefly)', done:'Done',
    connReq:'Requesting USB permission...', allow:'Tap "Allow" on the device prompt' }
};
let lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const t = k => I18N[lang][k] || k;
function applyLang(){
  document.getElementById('title').textContent = t('title');
  document.getElementById('statusText').textContent = adb ? t('connected') : t('conn');
  document.getElementById('usbBtn').textContent = t('usbBtn');
  document.getElementById('discBtn').textContent = t('disc');
  document.getElementById('wirelessLabel').textContent = t('wireless');
  document.getElementById('tcpBtn').textContent = t('tcpBtn');
  document.getElementById('hint11').textContent = t('hint11');
  document.getElementById('lblModel').textContent = t('model');
  document.getElementById('lblOs').textContent = t('os');
  document.getElementById('lblBat').textContent = t('bat');
  document.getElementById('lblSel').textContent = t('sel');
  document.getElementById('lblPreset').textContent = t('preset');
  document.getElementById('lblLog').textContent = t('log');
  document.getElementById('cmdInput').placeholder = t('cmdPh');
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'English' : '中文';
}
document.getElementById('langBtn').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; applyLang(); };

// ---------- 日志 ----------
const logs = document.getElementById('logs');
function log(msg, type = 'info') {
  const d = document.createElement('div');
  d.className = 'lg ' + type;
  const time = new Date().toLocaleTimeString();
  const ts = document.createElement('span'); ts.className='t'; ts.textContent = `[${time}]`;
  const ms = document.createElement('span'); ms.textContent = msg;
  d.appendChild(ts); d.appendChild(ms);
  logs.appendChild(d); logs.scrollTop = logs.scrollHeight;
}
document.getElementById('clearBtn').onclick = () => { logs.innerHTML = ''; };

// ---------- 原生桥 ----------
const bridge = window.AdbBridge;
let adb = null;
let readController = null;
const pending = [];

function bytesToB64(bytes){
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBytes(b64){
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

window.__adbOnData = (b64) => {
  const bytes = b64ToBytes(b64);
  if (readController) { try { readController.enqueue(bytes); } catch(e){} }
  else pending.push(bytes);
};

window.__adbOnStatus = async (msg) => {
  if (msg === 'usb_requesting') { log(t('connReq'), 'info'); log(t('allow'), 'warn'); return; }
  if (msg === 'usb_connected') { log('USB bridge ready', 'succ'); await onChannelReady('usb'); return; }
  if (msg === 'tcp_connected') { log('TCP bridge ready', 'succ'); await onChannelReady('tcp'); return; }
  if (msg === 'usb_no_device') log(t('noUsb'), 'err');
  else if (msg === 'usb_permission_denied') log(t('permDenied'), 'err');
  else if (msg === 'usb_error' || msg === 'tcp_error') log(t('connErr'), 'err');
};

function createConnection(serial) {
  const readable = new ReadableStream({
    start(c) { readController = c; while (pending.length) { try { c.enqueue(pending.shift()); } catch(e){ break; } } },
    cancel() { readController = null; }
  });
  const writable = new WritableStream({
    write(chunk) {
      // chunk 可能是 Consumable<Uint8Array>（含 .value），取真实字节
      const bytes = chunk && chunk.value instanceof Uint8Array ? chunk.value : chunk;
      bridge.sendBase64(bytesToB64(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)));
    }
  });
  return { readable, writable, close: () => bridge.disconnect() };
}

async function onChannelReady(kind) {
  try {
    const serial = kind === 'usb' ? 'usb' : 'tcp:' + document.getElementById('ipInput').value.trim();
    const transport = await Promise.race([
      AdbDaemonTransport.authenticate({ serial, connection: createConnection(serial), credentialStore: memoryStore }),
      new Promise((_, rej) => setTimeout(() => rej(new Error(t('authFail') + '(15s timeout)')), 15000))
    ]);
    adb = new Adb(transport);
    document.getElementById('statusBadge').classList.add('ok');
    applyLang();
    log(t('connected') + ' (' + serial + ')', 'succ');
    loadDeviceInfo();
  } catch (e) {
    log(t('authFail') + e.message, 'err');
  }
}

// ---------- 执行 ----------
async function execute(cmd) {
  if (!adb) { log(t('noConn'), 'warn'); return null; }
  try {
    const proto = adb.subprocess.shellProtocol?.isSupported ? adb.subprocess.shellProtocol : adb.subprocess.noneProtocol;
    const res = await proto.spawnWaitText(cmd);
    return res.stdout || res.stderr || '';
  } catch (e) { log(t('err') + e.message, 'err'); return null; }
}

async function runShizuku() {
  log(t('shizukuSearch'), 'info');
  const p = await execute('pm path moe.shizuku.privileged.api');
  const m = p && p.match(/package:(.+)\/base\.apk/);
  if (!m) { log(t('shizukuNone'), 'warn'); return; }
  const dir = m[1].trim();
  const candidates = [`${dir}/lib/arm64/libshizuku.so`,`${dir}/lib/arm/libshizuku.so`,`${dir}/lib/x86_64/libshizuku.so`,`${dir}/lib/x86/libshizuku.so`];
  let so = '';
  for (const c of candidates) {
    const r = ((await execute(`ls ${c} 2>/dev/null`)) || '').trim();
    if (r && r.endsWith('libshizuku.so')) { so = c; break; }
  }
  if (!so) {
    const w = ((await execute(`ls ${dir}/lib/*/libshizuku.so 2>/dev/null`)) || '').trim();
    if (w.includes('libshizuku.so')) so = w.split('\n')[0].trim();
  }
  if (!so) { log(t('shizukuNoSo'), 'warn'); return; }
  log('> ' + so, 'cmd');
  const out = await execute(so);
  if (out && out.includes('shizuku_server pid is')) { log(out.trim(), 'succ'); log(t('shizukuOk'), 'succ'); }
  else log(out ? out.trim() : t('execOk'), 'info');
}

async function runTcpip(enable) {
  if (!adb) { log(t('noConn'), 'warn'); return; }
  try {
    const svc = new AdbTcpIpService(adb.transport);
    log(enable ? t('tcpipOn') : t('tcpipOff'), 'info');
    const out = enable ? await svc.setPort(5555) : await svc.disable();
    log(out.trim(), 'succ');
    log(t('tcpipRestart'), 'warn');
  } catch (e) { log(t('err') + e.message, 'err'); }
}

// ---------- 设备信息 ----------
async function loadDeviceInfo() {
  const model = ((await execute('getprop ro.product.manufacturer') || '') + ' ' + (await execute('getprop ro.product.model') || '')).trim();
  const rel = (await execute('getprop ro.build.version.release') || '').trim();
  const sdk = (await execute('getprop ro.build.version.sdk') || '').trim();
  const sel = (await execute('getenforce') || '').trim();
  const bat = (await execute('dumpsys battery') || '').match(/level:\s*(\d+)/);
  document.getElementById('infoModel').textContent = model || '-';
  document.getElementById('infoOs').textContent = rel ? `Android ${rel} (API ${sdk})` : '-';
  document.getElementById('infoSel').textContent = sel || '-';
  document.getElementById('infoBat').textContent = bat ? bat[1] + '%' : '-';
  document.getElementById('infoCard').style.display = 'block';
}

// ---------- 事件 ----------
document.getElementById('usbBtn').onclick = () => bridge.usbConnect();
document.getElementById('tcpBtn').onclick = () => {
  const ip = document.getElementById('ipInput').value.trim();
  if (!ip) { log(t('noCmd'), 'warn'); return; }
  const [h, p] = ip.includes(':') ? ip.split(':') : [ip, 5555];
  bridge.tcpConnect(h, parseInt(p) || 5555);
};
document.getElementById('discBtn').onclick = () => { bridge.disconnect(); adb = null; readController = null; document.getElementById('statusBadge').classList.remove('ok'); document.getElementById('infoCard').style.display='none'; applyLang(); log(t('disc'), 'info'); };

document.getElementById('preset').onchange = async () => {
  const v = document.getElementById('preset').value;
  if (!v) return;
  if (v === 'shizuku') { await runShizuku(); return; }
  if (v === 'tcpip_on') { await runTcpip(true); return; }
  if (v === 'tcpip_off') { await runTcpip(false); return; }
  document.getElementById('cmdInput').value = v;
};

document.getElementById('execBtn').onclick = runCmd;
document.getElementById('cmdInput').onkeydown = (e) => { if (e.key === 'Enter') runCmd(); };

async function runCmd() {
  const v = document.getElementById('cmdInput').value.trim();
  if (!v) { log(t('noCmd'), 'warn'); return; }
  if (!adb) { log(t('noConn'), 'warn'); return; }
  log('> ' + v, 'cmd');
  const r = await execute(v);
  if (r !== null) log(r.trim() ? r.trim() : t('execOk'), r && r.trim() ? 'succ' : 'info');
}

// ---------- 启动 ----------
applyLang();
log(t('ready'), 'info');
</script>
</body>
</html>
